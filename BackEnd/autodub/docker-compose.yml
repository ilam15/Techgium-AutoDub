services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodub_net

  api:
    build:
      context: .
    restart: always
    volumes:
      - ./temp:/app/temp
      - ./static:/app/static
      - ./src:/app/src
      - lid_models:/app/engine/lid
      - audio_data:/app/audio_data
      - tts_dub_data:/app/TTS_DUB
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_GPU=false
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    shm_size: '4gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autodub_net

  worker_default:
    build:
      context: .
    restart: always
    volumes:
      - ./temp:/app/temp
      - ./static:/app/static
      - ./src:/app/src
      - lid_models:/app/engine/lid
      - audio_data:/app/audio_data
      - tts_dub_data:/app/TTS_DUB
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_GPU=false
      - PYTHONPATH=/app
    shm_size: '4gb'
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A src.core.celery_app worker --loglevel=info -Q default -n worker_default@%h --concurrency=1 --prefetch-multiplier=1
    networks:
      - autodub_net

  worker_tts:
    build:
      context: .
    restart: always
    volumes:
      - ./temp:/app/temp
      - ./static:/app/static
      - ./src:/app/src
      - lid_models:/app/engine/lid
      - audio_data:/app/audio_data
      - tts_dub_data:/app/TTS_DUB
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_GPU=false
      - PYTHONPATH=/app
    shm_size: '2gb'
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A src.core.celery_app worker --loglevel=info -Q tts -n worker_tts@%h --concurrency=1 --prefetch-multiplier=1
    networks:
      - autodub_net

  flower:
    build:
      context: .
    restart: always
    command: celery -A src.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autodub_net

networks:
  autodub_net:
    driver: bridge

volumes:
  lid_models:
  audio_data:
  tts_dub_data:
